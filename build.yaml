name: Build SDM845 Kernel Package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git bc bison flex build-essential \
            libssl-dev libelf-dev dwarves cpio \
            gcc-aarch64-linux-gnu rsync fakeroot \
            debhelper debhelper-compat libdw-dev

      - name: Clone kernel
        run: |
          git clone --depth 1 --branch sdm845-linus \
            https://codeberg.org/sdm845/linux.git

      - name: Build Debian Packages for Mobian
        run: |
          cd linux
          
          # 1. Generate core Snapdragon configurations
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            defconfig sdm845.config

          # 2. Prevent the build system from appending tracking hashes (+g559dcc2...)
          scripts/config --disable LOCALVERSION_AUTO

          # 3. Build optimized deb files with your exact targeted naming layout
          DEB_BUILD_PROFILES=pkg.linux-upstream.nokernelheaders \
          make -j$(nproc) \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LOCALVERSION="-sdm845" \
            bindeb-pkg

      - name: Upload Mobian Kernel Packages
        uses: actions/upload-artifact@v4
        with:
          name: mobian-sdm845-kernel
          path: |
            ./linux-image-*_arm64.deb
